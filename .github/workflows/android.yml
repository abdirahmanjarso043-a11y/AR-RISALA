name: Build AR-RISALA APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ar-risala-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AR-RISALA-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  download-verify-hadith:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download and verify 1,500 licensed Arabic texts
        run: python scripts/download_verify_hadith.py
      - name: Upload verified Arabic-only library and report
        uses: actions/upload-artifact@v4
        with:
          name: AR-RISALA-verified-hadith-arabic-1500
          path: |
            build/hadith/ar-risala-hadith-arabic-1500.json
            build/hadith/verification-report.json
          if-no-files-found: error
          retention-days: 90
