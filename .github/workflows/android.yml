name: Build AR-RISALA APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ar-risala-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AR-RISALA-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  download-verify-hadith:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate bundled app content
        run: python scripts/validate_content.py
      - name: Verify remaining Hadith - part 1 (525 records)
        run: python scripts/download_verify_hadith.py --total 525 --skip-per-book 75 --batch-number 4
      - name: Upload verified Arabic library - part 1
        uses: actions/upload-artifact@v4
        with:
          name: AR-RISALA-verified-hadith-part-1-525
          path: |
            build/hadith/ar-risala-hadith-arabic-525-batch-4.json
            build/hadith/verification-report-batch-4.json
          if-no-files-found: error
          retention-days: 90
      - name: Verify remaining Hadith - part 2 (525 records)
        run: python scripts/download_verify_hadith.py --total 525 --skip-per-book 163,163,163,162,162,162 --batch-number 5
      - name: Upload verified Arabic library - part 2
        uses: actions/upload-artifact@v4
        with:
          name: AR-RISALA-verified-hadith-part-2-525
          path: |
            build/hadith/ar-risala-hadith-arabic-525-batch-5.json
            build/hadith/verification-report-batch-5.json
          if-no-files-found: error
          retention-days: 90
