<script>
const surahs=["Al-Fatihah","Al-Baqarah","Aal-Imran","An-Nisa","Al-Ma'idah","Al-An'am","Al-A'raf","Al-Anfal","At-Tawbah","Yunus","Hud","Yusuf","Ar-Ra'd","Ibrahim","Al-Hijr","An-Nahl","Al-Isra","Al-Kahf","Maryam","Ta-Ha","Al-Anbiya","Al-Hajj","Al-Mu'minun","An-Nur","Al-Furqan","Ash-Shu'ara","An-Naml","Al-Qasas","Al-Ankabut","Ar-Rum","Luqman","As-Sajdah","Al-Ahzab","Saba","Fatir","Ya-Sin","As-Saffat","Sad","Az-Zumar","Ghafir","Fussilat","Ash-Shura","Az-Zukhruf","Ad-Dukhan","Al-Jathiyah","Al-Ahqaf","Muhammad","Al-Fath","Al-Hujurat","Qaf","Adh-Dhariyat","At-Tur","An-Najm","Al-Qamar","Ar-Rahman","Al-Waqi'ah","Al-Hadid","Al-Mujadilah","Al-Hashr","Al-Mumtahanah","As-Saff","Al-Jumu'ah","Al-Munafiqun","At-Taghabun","At-Talaq","At-Tahrim","Al-Mulk","Al-Qalam","Al-Haqqah","Al-Ma'arij","Nuh","Al-Jinn","Al-Muzzammil","Al-Muddaththir","Al-Qiyamah","Al-Insan","Al-Mursalat","An-Naba","An-Nazi'at","Abasa","At-Takwir","Al-Infitar","Al-Mutaffifin","Al-Inshiqaq","Al-Buruj","At-Tariq","Al-A'la","Al-Ghashiyah","Al-Fajr","Al-Balad","Ash-Shams","Al-Layl","Ad-Duha","Ash-Sharh","At-Tin","Al-Alaq","Al-Qadr","Al-Bayyinah","Az-Zalzalah","Al-Adiyat","Al-Qari'ah","At-Takathur","Al-Asr","Al-Humazah","Al-Fil","Quraysh","Al-Ma'un","Al-Kawthar","Al-Kafirun","An-Nasr","Al-Masad","Al-Ikhlas","Al-Falaq","An-Nas"];
const sahaba=[
["Abu Bakr as-Siddiq","Abdullah ibn Abi Quhafah was among the earliest Muslims and the close companion of the Prophet ﷺ. He accompanied the Prophet during the Hijrah to Madinah. After the Prophet’s death in 632 CE, he became the first caliph. His leadership included preserving the Muslim community during the Ridda conflicts and initiating the collection of Qur’anic material into one compilation after the Battle of Yamamah.","Ibn Hisham, al-Sirah al-Nabawiyyah; Sahih al-Bukhari, reports on the compilation of the Qur’an."],
["Umar ibn al-Khattab","Umar ibn al-Khattab was an early and prominent Companion who became the second caliph after Abu Bakr. His caliphate (634–644 CE) saw major administrative organisation and the expansion of the Muslim polity. Muslim historical tradition remembers him for public accountability, firmness and concern for justice.","Ibn Sa'd, al-Tabaqat al-Kubra; al-Tabari, Ta'rikh al-Rusul wa-l-Muluk."],
["Uthman ibn Affan","Uthman ibn Affan was an early Muslim, known for generosity and modesty. He became the third caliph in 644 CE. During his caliphate, a standard written recension of the Qur’an was commissioned and sent to major centres to help preserve a common recitation text. He was killed in 656 CE during a period of severe internal conflict.","Sahih al-Bukhari, reports on the standardisation of the Qur’an; Ibn Sa'd, al-Tabaqat al-Kubra."],
["Ali ibn Abi Talib","Ali ibn Abi Talib was the Prophet’s cousin and son-in-law, husband of Fatimah. He was among the earliest Muslims and was known in Islamic tradition for knowledge, courage and closeness to the Prophet ﷺ. He became the fourth caliph in 656 CE and was killed in 661 CE.","Ibn Hisham, al-Sirah al-Nabawiyyah; Ibn Sa'd, al-Tabaqat al-Kubra."],
["Khadijah bint Khuwaylid","Khadijah was a respected merchant of Makkah and the first wife of the Prophet Muhammad ﷺ. She was the first person to believe in his message and supported him through the earliest and most difficult years of revelation. She is honoured as one of the greatest women in Islamic tradition.","Ibn Hisham, al-Sirah al-Nabawiyyah; Sahih al-Bukhari, virtues of Khadijah."],
["Bilal ibn Rabah","Bilal was an early Muslim who endured persecution for his faith in Makkah and was freed by Abu Bakr. He became known as the Prophet’s muezzin, calling the believers to prayer. His life is remembered as a powerful example of steadfastness and dignity.","Ibn Sa'd, al-Tabaqat al-Kubra; Ibn Hajar, al-Isabah fi Tamyiz al-Sahabah."],
["Abd al-Rahman ibn Awf","Abd al-Rahman ibn Awf was among the early Muslims and emigrated to Madinah, where he became known as a successful trader and generous giver. He is included in the well-known group of ten Companions given glad tidings of Paradise in hadith reports.","Jami at-Tirmidhi, virtues of the ten; Ibn Sa'd, al-Tabaqat al-Kubra."],
["Talhah ibn Ubayd Allah","Talhah ibn Ubayd Allah was an early Muslim and a Companion remembered for his courage at the Battle of Uhud, where reports describe him protecting the Prophet ﷺ and suffering serious injuries. He is also named among the ten Companions given glad tidings of Paradise.","Jami at-Tirmidhi, virtues of the ten; Ibn Hajar, al-Isabah fi Tamyiz al-Sahabah."],
["Zubayr ibn al-Awwam","Al-Zubayr ibn al-Awwam was a cousin of the Prophet ﷺ through his aunt Safiyyah and one of the early Muslims. He took part in major events of the early Muslim community and is named among the ten Companions given glad tidings of Paradise.","Sahih al-Bukhari, virtues of the Companions; Ibn Sa'd, al-Tabaqat al-Kubra."],
["Sa'd ibn Abi Waqqas","Sa'd ibn Abi Waqqas was among the earliest Muslims and a skilled archer. He is named among the ten Companions given glad tidings of Paradise. In the caliphate of Umar, he commanded Muslim forces in the campaign associated with al-Qadisiyyah and later helped establish Kufa.","Jami at-Tirmidhi, virtues of the ten; al-Tabari, Ta'rikh al-Rusul wa-l-Muluk."],
["Ubadah ibn al-Samit","Ubadah ibn al-Samit was an Ansari Companion who took part in the pledges at al-Aqabah and later served the Muslim community as a teacher and judge in Syria. He transmitted important hadith reports and is remembered among the early leaders of the Ansar.","Ibn Hisham, al-Sirah al-Nabawiyyah; Ibn Sa'd, al-Tabaqat al-Kubra; Ibn Hajar, al-Isabah."],
["Abdullah ibn Umar","Abdullah ibn Umar was the son of Umar ibn al-Khattab and a young Companion in Madinah. He became renowned for careful adherence to the Prophet’s practice and transmitted many hadith reports. He was also known for devotion and caution in religious matters.","Sahih al-Bukhari and Sahih Muslim, narrations of Ibn Umar; Ibn Hajar, al-Isabah."],
["Sa'id ibn Zayd","Sa'id ibn Zayd was an early Muslim and a Companion counted among the ten promised Paradise in well-known reports. He was the husband of Fatimah bint al-Khattab, whose household was connected with Umar's acceptance of Islam. He kept a relatively low public profile while remaining part of the early community.","Jami at-Tirmidhi, virtues of the ten; Ibn Sa'd, al-Tabaqat al-Kubra."],
["Abu Talhah al-Ansari","Abu Talhah, Zayd ibn Sahl, was a Companion of the Ansar known for devotion and generosity. Reports describe his love for the Prophet ﷺ and his donation of the garden Bayruha after the revelation encouraging charity from what one loves.","Sahih al-Bukhari, tafsir of Qur'an 3:92; Ibn Sa'd, al-Tabaqat al-Kubra."],
["Umm Ayman (Barakah)","Umm Ayman, also known as Barakah, cared for the Prophet ﷺ during his early life and remained close to his household. She accepted Islam and is remembered with affection and respect in reports about the early Muslim community.","Ibn Sa'd, al-Tabaqat al-Kubra; Ibn Hajar, al-Isabah fi Tamyiz al-Sahabah."],
["Nusaybah bint Ka'b","Nusaybah bint Ka'b, known as Umm 'Umarah, was a woman of the Ansar who pledged allegiance at al-'Aqabah. Islamic historical reports remember her courage and steadfastness while defending the Prophet ﷺ during the Battle of Uhud.","Ibn Sa'd, al-Tabaqat al-Kubra; Ibn Hajar, al-Isabah fi Tamyiz al-Sahabah."],
["Khabbab ibn al-Aratt","Khabbab ibn al-Aratt was among the earliest Muslims and endured severe persecution in Makkah. He later migrated and took part in the early Muslim community. Reports preserve his patience under hardship and his role in teaching Qur'an.","Ibn Hisham, al-Sirah al-Nabawiyyah; Sahih al-Bukhari, reports concerning early persecution."],
["Suhayb ar-Rumi","Suhayb ar-Rumi was an early Muslim who endured persecution in Makkah. During the Hijrah, he gave up much of his wealth to leave safely and join the Prophet ﷺ in Madinah; reports remember this sacrifice with praise.","Ibn Hisham, al-Sirah al-Nabawiyyah; al-Hakim, al-Mustadrak, reports on the Hijrah."],
["Abu al-Darda","Abu al-Darda, 'Uwaymir ibn Zayd, was a Companion of Madinah remembered for worship, wisdom and teaching. He became known for his knowledge of the Qur'an and transmitted reports about learning, remembrance and good character.","Sunan Abi Dawud, reports from Abu al-Darda; Ibn Sa'd, al-Tabaqat al-Kubra."],
["Hudhayfah ibn al-Yaman","Hudhayfah ibn al-Yaman was a Companion entrusted with sensitive knowledge about certain hypocrites in Madinah. He transmitted important reports, including teachings about trials and fitan, and took part in the early Muslim community.","Sahih al-Bukhari and Sahih Muslim, reports of Hudhayfah; Ibn Sa'd, al-Tabaqat al-Kubra."],
["Jabir ibn Abdullah","Jabir ibn Abdullah was a young Companion from the Ansar whose father was martyred at Uhud. He transmitted many hadith reports and lived long enough to teach later generations. His narrations cover worship, transactions and the Prophet's conduct.","Sahih al-Bukhari and Sahih Muslim, narrations of Jabir; Ibn Sa'd, al-Tabaqat al-Kubra."],
["Abdullah ibn Amr ibn al-As","Abdullah ibn Amr ibn al-As was a Companion known for devotion and recording Prophetic teachings. Reports mention the Prophet ﷺ permitting him to write what he heard. He transmitted hadith and was recognised for worship and knowledge.","Sunan Abi Dawud, reports on writing hadith; Sahih al-Bukhari, narrations of Abdullah ibn Amr."],
["Sa'd ibn Mu'adh","Sa'd ibn Mu'adh was a leading figure among the Ansar of Madinah and chief of the Aws. He embraced Islam through the efforts of Mus'ab ibn Umayr and supported the Prophet ﷺ and the Muslim community. He died after being wounded at the Battle of the Trench.","Ibn Hisham, al-Sirah al-Nabawiyyah; Sahih al-Bukhari and Sahih Muslim, reports concerning Sa'd."],
["Usayd ibn Hudayr","Usayd ibn Hudayr was an Ansari Companion of the Aws. His acceptance of Islam followed the teaching visit of Mus'ab ibn Umayr in Madinah. He became known for Qur'an recitation; an authentic report describes angels drawing near while he recited Surah al-Baqarah.","Sahih al-Bukhari, virtue of Qur'an recitation; Ibn Sa'd, al-Tabaqat al-Kubra."],
["Abu Ayyub al-Ansari","Abu Ayyub Khalid ibn Zayd hosted the Prophet ﷺ when he first arrived in Madinah during the Hijrah. He remained devoted to the Muslim community and took part in later campaigns. He is associated with the early history of Madinah and the Prophet's migration.","Ibn Hisham, al-Sirah al-Nabawiyyah; Sahih al-Bukhari, reports on the Prophet's arrival in Madinah."],
["Al-Bara ibn Azib","Al-Bara ibn Azib was an Ansari Companion who transmitted reports about the Prophet ﷺ and participated in the early Muslim community. His narrations include descriptions of the Prophet's character, prayer and major events. He lived into the period of the later caliphs.","Sahih al-Bukhari and Sahih Muslim, narrations of al-Bara; Ibn Sa'd, al-Tabaqat al-Kubra."],
["Imran ibn Husayn","Imran ibn Husayn was a Companion known for learning and devotion. He transmitted hadith reports on worship and religious practice and was respected among the people of Basra. Later Muslim tradition remembers his knowledge and commitment to the Sunnah.","Sahih al-Bukhari and Sahih Muslim, narrations of Imran; Ibn Sa'd, al-Tabaqat al-Kubra."],
["Abu Qatadah al-Ansari","Abu Qatadah al-Ansari was a Companion who participated in military expeditions and transmitted reports about the Prophet ﷺ. His narrations include guidance on prayer, purification and conduct. He was known by the kunyah Abu Qatadah.","Sahih al-Bukhari and Sahih Muslim, narrations of Abu Qatadah; Ibn Sa'd, al-Tabaqat al-Kubra."],
["Zayd ibn Harithah","Zayd ibn Harithah was a close Companion of the Prophet ﷺ and the only Companion named explicitly in the Qur'an, in Surah al-Ahzab (33:37). He was appointed to lead several expeditions and was martyred at the Battle of Mu'tah.","Qur'an 33:37; Ibn Hisham, al-Sirah al-Nabawiyyah; Sahih al-Bukhari, reports on the Battle of Mu'tah."],
["Usamah ibn Zayd","Usamah ibn Zayd was the son of Zayd ibn Harithah and a beloved young Companion of the Prophet ﷺ. The Prophet appointed him to lead an expedition shortly before his death. Usamah later served the Muslim community during the caliphate of Abu Bakr.","Sahih al-Bukhari and Sahih Muslim, reports about Usamah; Ibn Sa'd, al-Tabaqat al-Kubra."],
["Abdullah ibn Abbas","Abdullah ibn Abbas was the Prophet's cousin and a major early authority in Qur'anic interpretation and knowledge. The Prophet ﷺ supplicated for him to be granted understanding of the religion. He transmitted many hadith reports and became known as a scholar among the Companions.","Sahih al-Bukhari, reports of the supplication for Ibn Abbas; Ibn Sa'd, al-Tabaqat al-Kubra."],
["Thabit ibn Qays","Thabit ibn Qays ibn Shammas was an Ansari Companion known for eloquence and for speaking on behalf of the Muslim community. He served as an orator and is mentioned in reports concerning the Qur'anic instruction about lowering one's voice in the Prophet's presence.","Qur'an 49:2; Tafsir Ibn Kathir on 49:2; Ibn Sa'd, al-Tabaqat al-Kubra."],
["Abu Sufyan ibn Harb","Abu Sufyan ibn Harb was a leading Qurayshi figure who later accepted Islam before the conquest of Makkah. After becoming Muslim, he took part in the community and is mentioned in accounts of the events around Hunayn and the conquest. Historical reports about his earlier opposition and later role should be read in their full context.","Ibn Hisham, al-Sirah al-Nabawiyyah; Ibn Sa'd, al-Tabaqat al-Kubra."],
["Amr ibn al-As","Amr ibn al-As was a Companion known for diplomacy and military leadership. He accepted Islam before the conquest of Makkah and later led the Muslim campaign in Egypt. Reports about his life appear in early biographical and historical works.","Ibn Sa'd, al-Tabaqat al-Kubra; al-Tabari, Ta'rikh al-Rusul wa-l-Muluk."],
["Mu'awiyah ibn Abi Sufyan","Mu'awiyah ibn Abi Sufyan was a Companion and scribe associated with the Prophet's administration. He later governed Syria and became the first Umayyad caliph. His political career is discussed extensively in early Islamic histories, whose accounts should be compared carefully.","Ibn Sa'd, al-Tabaqat al-Kubra; al-Tabari, Ta'rikh al-Rusul wa-l-Muluk."],
["Umm Sulaym bint Milhan","Umm Sulaym was an Ansari woman of Madinah and the mother of Anas ibn Malik. She embraced Islam early in Madinah and is remembered in hadith reports for her faith, courage and hospitality. Her home was among those visited by the Prophet ﷺ.","Sahih al-Bukhari and Sahih Muslim, reports concerning Umm Sulaym; Ibn Sa'd, al-Tabaqat al-Kubra."],
["Umm Haram bint Milhan","Umm Haram was an Ansari woman and relative of Umm Sulaym. Authentic reports describe the Prophet ﷺ visiting her and informing her of people from his community who would travel by sea. She is remembered in connection with the early Muslim naval expeditions.","Sahih al-Bukhari and Sahih Muslim, reports concerning the sea expedition; Ibn Sa'd, al-Tabaqat al-Kubra."],
["Safiyyah bint Abd al-Muttalib","Safiyyah was the Prophet's paternal aunt and the mother of al-Zubayr ibn al-Awwam. She accepted Islam and is remembered in accounts of the early Muslim community, including reports of her courage during the Battle of the Trench.","Ibn Hisham, al-Sirah al-Nabawiyyah; Ibn Sa'd, al-Tabaqat al-Kubra."],
["Hafsa bint Umar","Hafsa was a wife of the Prophet ﷺ and daughter of Umar ibn al-Khattab. She is known for her devotion and for the Qur'anic manuscript kept in her custody, which was consulted when the standard copies were prepared under Uthman.","Sahih al-Bukhari, reports on the collection of the Qur'an; Ibn Sa'd, al-Tabaqat al-Kubra."],
["Zaynab bint Jahsh","Zaynab bint Jahsh was a wife of the Prophet ﷺ. The Qur'an refers to her marriage in Surah al-Ahzab (33:37). Reports describe her generosity and devotion to charity, and she is included among the Mothers of the Believers.","Qur'an 33:37; Sahih al-Bukhari and Sahih Muslim, reports concerning the wives of the Prophet; Ibn Sa'd."],
["Juwayriyah bint al-Harith","Juwayriyah was a wife of the Prophet ﷺ and daughter of al-Harith ibn Abi Dirar. Reports describe her marriage and the release of many captives from her people by Muslims who did not wish to keep the Prophet's in-laws in captivity.","Sahih Muslim, reports concerning Juwayriyah; Ibn Sa'd, al-Tabaqat al-Kubra."],
["Rabi'ah ibn Ka'b al-Aslami","Rabi'ah ibn Ka'b al-Aslami served the Prophet ﷺ and is remembered for a report in which he asked to accompany the Prophet in Paradise. The Prophet advised him to help fulfil that hope through frequent prostration. His narration is cited in discussions of voluntary prayer.","Sahih Muslim, hadith of Rabi'ah ibn Ka'b on frequent prostration; Ibn Sa'd, al-Tabaqat al-Kubra."],
["Abbas ibn Abd al-Muttalib","Abbas was the Prophet's uncle. He accepted Islam before the conquest of Makkah according to the well-known biographical accounts and later supported the Muslim community. His descendants became known as the Abbasids.","Ibn Hisham, al-Sirah al-Nabawiyyah; Ibn Sa'd, al-Tabaqat al-Kubra."],
["Hamza ibn Abd al-Muttalib","Hamza was the Prophet's uncle and a courageous early Muslim. He defended the Prophet in Makkah and was martyred at the Battle of Uhud. Muslim tradition honours him with the title Sayyid al-Shuhada.","Ibn Hisham, al-Sirah al-Nabawiyyah; Sahih al-Bukhari, reports on Uhud."],
["Abdullah ibn Jahsh","Abdullah ibn Jahsh was an early emigrant to Abyssinia and later Madinah. He commanded the expedition at Nakhlah and was martyred at Uhud. He belonged to the early Muslim community that endured persecution in Makkah.","Ibn Hisham, al-Sirah al-Nabawiyyah; Ibn Sa'd, al-Tabaqat al-Kubra."],
["Arqam ibn Abi al-Arqam","Al-Arqam provided his home in Makkah as a place where the early Muslims could meet and learn from the Prophet ﷺ. His house, Dar al-Arqam, is remembered as an important centre in the earliest period of Islam.","Ibn Hisham, al-Sirah al-Nabawiyyah; Ibn Sa'd, al-Tabaqat al-Kubra."],
["Khabib ibn Adi","Khubaib ibn Adi was a Companion captured after the expedition of al-Raji and executed at Makkah. Reports remember his steadfastness and prayer before his death. His story is recounted in early hadith and biography sources.","Sahih al-Bukhari, reports of the events of al-Raji; Ibn Hisham, al-Sirah."],
["Zayd ibn al-Khattab","Zayd ibn al-Khattab was the brother of Umar ibn al-Khattab and an early Muslim. He was martyred at the Battle of Yamamah. Biographical works describe his courage and commitment.","Ibn Sa'd, al-Tabaqat al-Kubra; al-Tabari, Ta'rikh."],
["Abu Dujanah Simak ibn Kharashah","Abu Dujanah was an Ansari Companion remembered for bravery, particularly at the Battle of Uhud. Reports describe him carrying the Prophet's sword during the battle and defending the Muslim ranks.","Ibn Hisham, al-Sirah al-Nabawiyyah; Ibn Sa'd, al-Tabaqat al-Kubra."],
["Sahl ibn Hunayf","Sahl ibn Hunayf was an Ansari Companion who participated in major events including Badr and later served the Muslim community. He is mentioned in reports about the pledge at Hudaybiyyah and early Islamic history.","Sahih Muslim, reports concerning Hudaybiyyah; Ibn Sa'd, al-Tabaqat al-Kubra."],
["Uthman ibn Maz'un","Uthman ibn Maz'un was among the early Muslims and emigrated to Abyssinia. He was known for devotion and asceticism and was among the first Muhajirun to die in Madinah. The Prophet ﷺ attended his funeral.","Ibn Hisham, al-Sirah al-Nabawiyyah; Sahih al-Bukhari, funeral reports."],
["Abu Salamah Abdullah ibn Abd al-Asad","Abu Salamah was an early Muslim and among those who emigrated to Abyssinia and Madinah. He was married to Umm Salamah and died after wounds from the Battle of Uhud. His family is prominent in the Prophet's biography.","Ibn Hisham, al-Sirah al-Nabawiyyah; Ibn Sa'd, al-Tabaqat al-Kubra."],
["Abu Lubabah ibn Abd al-Mundhir","Abu Lubabah was an Ansari Companion who participated in the events around Badr. He is remembered in connection with a serious personal error during the siege of Banu Qurayzah, his repentance and the Qur'anic discussion of repentance.","Qur'an 8:27 and classical tafsir; Ibn Hisham, al-Sirah al-Nabawiyyah."],
["Ka'b ibn Malik","Ka'b ibn Malik was an Ansari poet and Companion. He stayed behind from the Tabuk expedition and later became one of the three whose sincere repentance is described in Qur'an 9:118. He transmitted hadith and accounts of the Prophet's campaigns.","Qur'an 9:118; Sahih al-Bukhari and Sahih Muslim, account of Ka'b's repentance."],
["Hilal ibn Umayyah","Hilal ibn Umayyah was one of the three Companions whose repentance after staying behind from Tabuk is described in Qur'an 9:118. His account is preserved alongside that of Ka'b ibn Malik and Murarah ibn al-Rabi'.","Qur'an 9:118; Sahih al-Bukhari, account of the three who stayed behind."],
["Murarah ibn al-Rabi'","Murarah ibn al-Rabi' was an Ansari Companion included among the three whose repentance after the Tabuk expedition is recorded in Qur'an 9:118. The account highlights honesty, patience and eventual forgiveness.","Qur'an 9:118; Sahih al-Bukhari, account of the three who stayed behind."],
["Umm Hani bint Abi Talib","Umm Hani bint Abi Talib was the daughter of Abu Talib and sister of Ali ibn Abi Talib. Reports describe the Prophet ﷺ praying in her home on the day of the conquest of Makkah. She also appears in reports about granting protection to people on that day.","Sahih al-Bukhari, report of the Prophet praying in Umm Hani’s home; Sunan Abi Dawud, report of the protection she granted; Ibn Hajar, al-Isabah fi Tamyiz al-Sahabah."],
["Abu Rafi'","Abu Rafi' was a freedman associated with the Prophet ﷺ and served him. Reports mention his role in the Prophet's household and expeditions. Several individuals are known by this kunyah, so biographies distinguish them carefully.","Ibn Sa'd, al-Tabaqat al-Kubra; Ibn Hajar, al-Isabah."],
["Thawban ibn Bujdud","Thawban was a freedman and close attendant of the Prophet ﷺ. He transmitted hadith reports, including teachings about the Prophet's concern for his community. He is listed among the Companions who narrated from the Prophet.","Sahih Muslim, narrations of Thawban; Ibn Sa'd, al-Tabaqat al-Kubra."],
["Safinah","Safinah was a freedman who served the Prophet ﷺ and later transmitted reports. His name is often given as Safinah, meaning 'ship', a name associated in reports with an incident during travel. Details of some stories require careful source assessment.","Sunan al-Tirmidhi and other hadith collections, reports of Safinah; Ibn Hajar, al-Isabah."],
["Abu Mahdhurah Samurah ibn Mi'yar","Abu Mahdhurah was a Companion known for his role as a mu'adhdhin in Makkah. Reports describe the Prophet ﷺ teaching him the words of the adhan. His account is preserved in hadith collections.","Sahih Muslim, reports on the adhan of Abu Mahdhurah; Sunan Abi Dawud."],
["Abdullah ibn Zayd ibn Abd Rabbih","Abdullah ibn Zayd was an Ansari Companion associated with the vision of the wording of the adhan. The Prophet ﷺ instructed that the words be taught to Bilal. His report is recorded in hadith collections.","Sunan Abi Dawud and Jami' al-Tirmidhi, reports on the adhan; Ibn Sa'd."],
["Rifa'ah ibn Rafi'","Rifa'ah ibn Rafi' was an Ansari Companion who participated at Badr and transmitted reports about prayer. A well-known narration describes the Prophet ﷺ explaining the correct manner of prayer to a man who prayed poorly.","Sahih al-Bukhari and Sahih Muslim, hadith of the man who prayed poorly; Ibn Sa'd."],
["Wabisah ibn Ma'bad","Wabisah ibn Ma'bad was a Companion who asked the Prophet ﷺ about righteousness and sin. The report teaches a person to consider what brings peace to the heart and what causes unease, while remaining grounded in revelation and sound knowledge.","Musnad Ahmad and al-Darimi, report of Wabisah; biographical works."],
["Abu Umamah al-Bahili","Abu Umamah al-Bahili was a Companion who transmitted numerous reports on worship, remembrance and charity. He lived in Syria in later life and was among the narrators known to later generations.","Sunan Abi Dawud, Jami' al-Tirmidhi and Musnad Ahmad, narrations of Abu Umamah; Ibn Sa'd."],
["Abu Sa'id al-Khudri","Abu Sa'id al-Khudri was an Ansari Companion who narrated many hadith reports. He was young during the Battle of Uhud and became an important teacher in Madinah. His narrations cover worship, ethics and community life.","Sahih al-Bukhari and Sahih Muslim, narrations of Abu Sa'id; Ibn Sa'd."],
["Abdullah ibn Salam","Abdullah ibn Salam was a Jewish scholar in Madinah who accepted Islam after recognising the Prophet ﷺ. Reports describe his questions and his testimony. He is mentioned in Qur'anic commentary and hadith literature.","Qur'an 46:10 (interpretations discussed by exegetes); Sahih al-Bukhari; Ibn Sa'd."],
["Tamim al-Dari","Tamim al-Dari was a Companion who accepted Islam and transmitted the report of al-Jassasah and the Dajjal. He was known for devotion and is associated with the early use of lamps in the Prophet's Mosque in some historical accounts.","Sahih Muslim, hadith of al-Jassasah; Ibn Sa'd, al-Tabaqat al-Kubra."],
["Adi ibn Hatim","Adi ibn Hatim was the son of Hatim al-Ta'i. He initially belonged to the Christian community of Tayyi' and later accepted Islam. He transmitted reports and took part in the Muslim community after his conversion.","Sahih al-Bukhari and Sahih Muslim, reports of Adi ibn Hatim; Ibn Sa'd."],
["Jarir ibn Abdullah al-Bajali","Jarir ibn Abdullah accepted Islam in the later Madinan period and became known for his good character. The Prophet ﷺ praised his appearance and entrusted him with responsibilities. He transmitted hadith on faith and conduct.","Sahih al-Bukhari and Sahih Muslim, narrations of Jarir; Ibn Sa'd."],
["Abu Bakr's freedman Amir ibn Fuhayrah","Amir ibn Fuhayrah was a freedman of Abu Bakr who helped the Prophet ﷺ and Abu Bakr during the Hijrah by tending sheep and concealing tracks. He was later martyred at Bi'r Ma'unah according to the sira accounts.","Ibn Hisham, al-Sirah al-Nabawiyyah; Ibn Sa'd, al-Tabaqat al-Kubra."],
["Hassan ibn Thabit","Hassan ibn Thabit was the celebrated poet of the Prophet ﷺ. He used his poetry to defend the Muslim community and is remembered among the notable Ansari Companions.","Sahih al-Bukhari, reports concerning Hassan ibn Thabit; Ibn Sa'd, al-Tabaqat al-Kubra."],
["Sa'd ibn Ubadah","Sa'd ibn Ubadah was a leading chief of the Khazraj in Madinah and a prominent supporter of the Prophet ﷺ. He took part in the early Muslim community and was known for generosity and leadership among the Ansar.","Ibn Hisham, al-Sirah al-Nabawiyyah; Ibn Sa'd, al-Tabaqat al-Kubra; Ibn Hajar, al-Isabah."],
["Abu Barzah al-Aslami","Abu Barzah al-Aslami was a Companion who transmitted hadith on prayer and conduct. He participated in the early Muslim community and is named among narrators in the hadith collections.","Sahih Muslim and Sunan Abi Dawud, narrations of Abu Barzah; Ibn Hajar, al-Isabah."],
["Abu Bakrah Nufay' ibn al-Harith","Abu Bakrah was a Companion who became Muslim during the siege of Ta'if. He transmitted hadith reports and lived in Basra. His narrations include guidance about prayer and social conduct.","Sahih al-Bukhari and Sahih Muslim, narrations of Abu Bakrah; Ibn Sa'd."],
["Abu al-Yasar Ka'b ibn Amr","Abu al-Yasar was an Ansari Companion who participated at Badr. Reports describe his encounter with al-Abbas during the battle and his later life among the people of Madinah.","Ibn Hisham, al-Sirah al-Nabawiyyah; Ibn Sa'd, al-Tabaqat al-Kubra."],
["Asma bint Yazid","Asma bint Yazid al-Ansariyyah was a Companion known for eloquence and for conveying questions on behalf of women. Reports mention her learning from the Prophet ﷺ and transmitting hadith.","Ibn Sa'd, al-Tabaqat al-Kubra; Ibn Hajar, al-Isabah."],
["Abu Humaid al-Sa'idi","Abu Humaid al-Sa'idi was an Ansari Companion who narrated a detailed description of the Prophet's prayer. His report is used by scholars when discussing the movements and posture of salah.","Sahih al-Bukhari, report of Abu Humaid; Sunan Abi Dawud."],
["Abu Mas'ud al-Ansari","Abu Mas'ud al-Ansari was a Companion who transmitted hadith on prayer, charity and kindness. His narrations include the instruction to give charity even if only with a small amount.","Sahih al-Bukhari and Sahih Muslim, narrations of Abu Mas'ud; Ibn Sa'd."],
["Sahl ibn Sa'd al-Sa'idi","Sahl ibn Sa'd al-Sa'idi was an Ansari Companion who lived a long life and transmitted reports about the Prophet ﷺ. His narrations are found in the major hadith collections.","Sahih al-Bukhari and Sahih Muslim, narrations of Sahl ibn Sa'd; Ibn Hajar, al-Isabah."],
["Abdullah ibn Rawahah","Abdullah ibn Rawahah was an Ansari poet and Companion who participated in the pledges of Aqabah and the battles of the Prophet ﷺ. He was one of the commanders martyred at Mu'tah.","Ibn Hisham, al-Sirah al-Nabawiyyah; Sahih al-Bukhari, reports of Mu'tah."],
["Zayd ibn Arqam","Zayd ibn Arqam was an Ansari Companion who transmitted reports about the Prophet ﷺ and events in Madinah. He is associated with the narration concerning the Prophet's address at Ghadir Khumm in some hadith collections.","Sahih Muslim, reports of Zayd ibn Arqam; Musnad Ahmad."],
["Abu Ayyash al-Zuraqi","Abu Ayyash al-Zuraqi was an Ansari Companion who narrated a report about a supplication taught by the Prophet ﷺ. The hadith appears in Sunan collections and is cited in books of remembrance.","Sunan Abi Dawud and Jami' al-Tirmidhi, report of Abu Ayyash."],
["Abdullah ibn Mughaffal","Abdullah ibn Mughaffal al-Muzani was a Companion who transmitted hadith on prayer, cleanliness and recitation. He lived in Basra and taught later generations.","Sahih al-Bukhari and Sahih Muslim, narrations of Abdullah ibn Mughaffal; Ibn Sa'd."],
["Abdullah ibn Busr","Abdullah ibn Busr al-Mazini was a Companion who lived a long life and transmitted hadith. Reports from him include teachings about remembrance and the virtue of simple consistent deeds.","Sahih Muslim and Sunan collections, narrations of Abdullah ibn Busr; Ibn Hajar, al-Isabah."],
["Abdullah ibn Unays","Abdullah ibn Unays was a Companion who took part in an expedition commissioned by the Prophet ﷺ. He transmitted hadith and is mentioned in accounts of the early campaigns.","Sunan Abi Dawud, reports of Abdullah ibn Unays; Ibn Hisham, al-Sirah."],
["Abdullah ibn Hanzalah","Abdullah ibn Hanzalah was the son of Hanzalah ibn Abi Amir, known in reports as the one washed by angels. Abdullah belonged to the generation of the Companions' children and is remembered in Madinan history.","Ibn Sa'd, al-Tabaqat al-Kubra; Ibn Hajar, al-Isabah."],
["Hanzalah ibn Abi Amir","Hanzalah was an Ansari Companion martyred at Uhud. Reports say he had entered the battle state after his wedding and was washed by angels, giving rise to his title Ghasil al-Mala'ikah.","Ibn Hisham, al-Sirah al-Nabawiyyah; Musnad Ahmad and biographical sources."],
["Amr ibn al-Jamuh","Amr ibn al-Jamuh was an elderly Ansari Companion who insisted on joining the Battle of Uhud despite a disability. He was martyred there, and his story is remembered for sincere devotion.","Ibn Hisham, al-Sirah al-Nabawiyyah; Ibn Sa'd, al-Tabaqat al-Kubra."],
["Abdullah ibn Amr ibn Haram","Abdullah ibn Amr ibn Haram was an Ansari Companion and the father of Jabir ibn Abdullah. He was martyred at Uhud. Reports describe his honoured status and his family's grief at his death.","Sahih al-Bukhari, reports of Jabir and his father; Ibn Sa'd."],
["Khuzaymah ibn Thabit","Khuzaymah ibn Thabit was an Ansari Companion known as Dhu al-Shahadatayn because the Prophet ﷺ accepted his testimony as equivalent to that of two men in a particular transaction. He was martyred at Siffin according to historical accounts.","Sunan Abi Dawud, report of Khuzaymah; Ibn Sa'd; al-Tabari."],
["Abu Khuzaymah al-Ansari","Abu Khuzaymah is named in reports about the collection of Qur'anic material under Abu Bakr. The identity and distinction between similarly named Companions should be checked against the original reports before publication.","Sahih al-Bukhari, account of Qur'an compilation; Ibn Hajar, al-Isabah."],
["Abu al-Haytham Malik ibn al-Tayyihan","Abu al-Haytham was an early Ansari Muslim who took part in the pledges of Aqabah. He welcomed the Prophet ﷺ in Madinah and is remembered in accounts of the early Ansar.","Ibn Hisham, al-Sirah al-Nabawiyyah; Ibn Sa'd, al-Tabaqat al-Kubra."],
["Bara' ibn Ma'rur","Bara' ibn Ma'rur was an early leader among the Ansar who took part in the pledge at Aqabah. He died before the Prophet's arrival in Madinah, and his story appears in accounts of the Hijrah period.","Ibn Hisham, al-Sirah al-Nabawiyyah; Ibn Sa'd, al-Tabaqat al-Kubra."],
["As'ad ibn Zurarah","As'ad ibn Zurarah was an early Ansari leader who accepted Islam before the Hijrah and helped spread Islam in Madinah. He hosted Mus'ab ibn Umayr during his teaching mission and died soon after the Prophet's arrival.","Ibn Hisham, al-Sirah al-Nabawiyyah; Ibn Sa'd, al-Tabaqat al-Kubra."],
["Abbad ibn Bishr","Abbad ibn Bishr was an Ansari Companion known for devotion, Qur'an recitation and courage. He was martyred during the Battle of Yamamah according to early biographical accounts.","Ibn Sa'd, al-Tabaqat al-Kubra; Ibn Hajar, al-Isabah; Prophetic Footsteps, Companion biographies."],
["Salama ibn al-Akwa'","Salama ibn al-Akwa' was a Companion known for courage and skill. He took part in several expeditions and transmitted hadith, including reports about the expedition of Dhat al-Qarad.","Sahih al-Bukhari and Sahih Muslim, narrations of Salama ibn al-Akwa'; Ibn Hajar, al-Isabah."],
["Abu Sufyan ibn al-Harith","Abu Sufyan ibn al-Harith was a cousin of the Prophet ﷺ who accepted Islam before the conquest of Makkah. He took part in the battles after his conversion and is remembered for his later devotion.","Ibn Hisham, al-Sirah al-Nabawiyyah; Ibn Sa'd, al-Tabaqat al-Kubra."],
["Fadl ibn Abbas","Al-Fadl ibn Abbas was a cousin of the Prophet ﷺ and accompanied him during the Farewell Pilgrimage. Reports describe him riding behind the Prophet and narrating events from that journey.","Sahih al-Bukhari and Sahih Muslim, reports of the Farewell Pilgrimage; Ibn Sa'd."],
["Qutham ibn Abbas","Qutham ibn Abbas was a cousin of the Prophet ﷺ and a member of the family of Abbas. Historical biographical works mention his service in the early Muslim period and his death in the eastern campaigns.","Ibn Sa'd, al-Tabaqat al-Kubra; al-Tabari, Ta'rikh."],
["Abdullah ibn Ja'far","Abdullah ibn Ja'far was the son of Ja'far ibn Abi Talib and was raised in the Prophet's household after his father's martyrdom. He became known for generosity and was respected in Madinah.","Sahih al-Bukhari, reports concerning Ja'far's family; Ibn Sa'd."],
["Muhammad ibn Maslamah","Muhammad ibn Maslamah was an Ansari Companion who participated in major campaigns and was entrusted with important duties. He is mentioned in early historical accounts of the Prophet's expeditions.","Ibn Hisham, al-Sirah al-Nabawiyyah; Ibn Sa'd, al-Tabaqat al-Kubra."],
["Rafi' ibn Khadij","Rafi' ibn Khadij was an Ansari Companion who took part in the events of the Madinan period and transmitted hadith about farming and transactions. His reports are preserved in the major collections.","Sahih al-Bukhari and Sahih Muslim, narrations of Rafi' ibn Khadij; Ibn Hajar, al-Isabah."],
["Abu al-Tufayl Amir ibn Wathilah","Abu al-Tufayl was among the last Companions to die according to many biographical accounts. He met the Prophet ﷺ as a child and later narrated hadith and reports about early Islamic history.","Sahih Muslim, narrations of Abu al-Tufayl; Ibn Sa'd; Ibn Hajar, al-Isabah."],
["Abu Juhayfah Wahb ibn Abdullah","Abu Juhayfah was a Companion who narrated reports about the Prophet ﷺ and Ali ibn Abi Talib. He was young during the Prophet's lifetime and later lived in Kufa.","Sahih al-Bukhari and Sahih Muslim, narrations of Abu Juhayfah; Ibn Sa'd."],
["Asim ibn Thabit","Asim ibn Thabit was an Ansari Companion and skilled archer. He was among the group sent on the mission of al-Raji and was killed after defending himself; early accounts remember his steadfastness.","Ibn Hisham, al-Sirah al-Nabawiyyah; Ibn Sa'd, al-Tabaqat al-Kubra; Prophetic Footsteps, Companion biographies."],
["Nu'ayman ibn Amr","Nu'ayman ibn Amr was an Ansari Companion remembered in reports for his humour and warm relationship with the Prophet ﷺ. His name appears in early biographical works on the Companions.","Ibn Sa'd, al-Tabaqat al-Kubra; Ibn Hajar, al-Isabah; Prophetic Footsteps, Companion biographies."],
["Abu al-As ibn al-Rabi'","Abu al-As ibn al-Rabi' was the husband of Zaynab, daughter of the Prophet ﷺ. He later accepted Islam and is mentioned in reports about the return of Zaynab to Madinah.","Ibn Hisham, al-Sirah al-Nabawiyyah; Ibn Sa'd."],
["Abdullah ibn Abi Awfa","Abdullah ibn Abi Awfa was a Companion who participated in early campaigns and later lived in Kufa. He transmitted hadith, including reports about charity and the Prophet's practice.","Sahih al-Bukhari and Sahih Muslim, narrations of Abdullah ibn Abi Awfa; Ibn Sa'd."],
["Abu al-Musayyib ibn Hazn","Al-Musayyib ibn Hazn was a Companion whose report about his father's refusal to accept Islam at death is recorded in Sahih al-Bukhari. He is included among the narrators from the Prophet ﷺ.","Sahih al-Bukhari, report of al-Musayyib ibn Hazn; Ibn Sa'd."],
["Abu Sa'id ibn al-Mu'alla","Abu Sa'id ibn al-Mu'alla was an Ansari Companion. A report from him explains the special status of Surah al-Fatihah as the greatest surah, as taught by the Prophet ﷺ.","Sahih al-Bukhari, report of Abu Sa'id ibn al-Mu'alla; Ibn Sa'd."],
["Abu Shurayh al-Khuza'i","Abu Shurayh al-Khuza'i was a Companion who narrated teachings about honouring guests and respecting the sanctity of Makkah. His hadith is found in the major collections.","Sahih al-Bukhari and Sahih Muslim, narrations of Abu Shurayh; Ibn Sa'd."],
["Umm Waraqah bint Abdullah","Umm Waraqah was a female Companion of Madinah known for devotion to the Qur'an. Reports mention that the Prophet ﷺ visited her and called her a martyr when speaking of her eventual death.","Sunan Abi Dawud, report concerning Umm Waraqah; Ibn Hajar, al-Isabah; Prophetic Footsteps, Companion biographies."],
["Abu Zayd Qays ibn al-Sakan","Abu Zayd Qays ibn al-Sakan was an Ansari Companion associated with Qur'an recitation. Early reports mention him among those who collected the Qur'an during the Prophet's lifetime, though lists vary.","Sahih al-Bukhari, reports on Qur'an collection; Ibn Sa'd."],
["Suraqah ibn Malik","Suraqah ibn Malik was a Qurayshi horseman who pursued the Prophet ﷺ and Abu Bakr during the Hijrah. After witnessing signs that stopped his pursuit, he returned and later accepted Islam. His story is preserved in the accounts of the migration.","Sahih al-Bukhari, reports of the Hijrah; Ibn Hisham, al-Sirah al-Nabawiyyah."],
["Uqbah ibn Amir al-Juhani","Uqbah ibn Amir was a Companion who transmitted hadith and was known for Qur'an recitation and knowledge. He served as a governor in Egypt and is associated with reports on archery and remembrance.","Sahih Muslim and Sunan collections, narrations of Uqbah; Ibn Sa'd, al-Tabaqat al-Kubra."],
["Nu'man ibn Bashir","Nu'man ibn Bashir was an Ansari Companion born after the Hijrah. He transmitted the famous hadith comparing the believers to one body and reports about fairness between children. He later held public office.","Sahih al-Bukhari and Sahih Muslim, narrations of Nu'man; Ibn Sa'd."],
["Samurah ibn Jundub","Samurah ibn Jundub was a Companion who transmitted numerous hadith reports. He lived in Basra and narrated teachings on prayer, manners and daily conduct.","Sahih al-Bukhari and Sahih Muslim, narrations of Samurah; Ibn Sa'd."],
["Al-Mughirah ibn Shu'bah","Al-Mughirah ibn Shu'bah was a Companion who accepted Islam before the conquest of Makkah and participated in later events. He transmitted hadith and served as a governor during the caliphates of Umar and later leaders.","Sahih al-Bukhari and Sahih Muslim, narrations of al-Mughirah; Ibn Sa'd."],
["Dihyah al-Kalbi","Dihyah al-Kalbi was a Companion known for his appearance and for carrying the Prophet's letter to the Byzantine emperor Heraclius according to sira accounts. Hadith reports identify him in connection with the angel Jibril appearing in human form.","Sahih al-Bukhari and Sahih Muslim, report of Jibril in the form of Dihyah; Ibn Hisham."],
["Wahshi ibn Harb","Wahshi ibn Harb was involved in the killing of Hamzah at Uhud before later accepting Islam. He subsequently fought in the Muslim campaigns. His account is a reminder of repentance and the changes that can follow guidance.","Sahih al-Bukhari, report of Wahshi; Ibn Hisham, al-Sirah al-Nabawiyyah."],
["Safwan ibn Umayyah","Safwan ibn Umayyah was a Qurayshi leader who initially opposed Islam and later accepted it after the conquest of Makkah. Reports describe the Prophet ﷺ lending him resources for the campaign of Hunayn, after which his faith strengthened.","Ibn Hisham, al-Sirah al-Nabawiyyah; Ibn Sa'd, al-Tabaqat al-Kubra."],
["Ikrimah ibn Abi Jahl","Ikrimah ibn Abi Jahl initially opposed the Prophet ﷺ but later accepted Islam after the conquest of Makkah. He became a committed Muslim and was martyred during the campaigns in the region of Syria according to historical reports.","Ibn Hisham, al-Sirah al-Nabawiyyah; al-Tabari, Ta'rikh."],
["Hakim ibn Hizam","Hakim ibn Hizam was a Qurayshi notable and relative of Khadijah. He accepted Islam around the conquest of Makkah and became known for generosity. He transmitted hadith about honesty in trade and giving charity.","Sahih al-Bukhari and Sahih Muslim, narrations of Hakim ibn Hizam; Ibn Sa'd."],
["Suhayl ibn Amr","Suhayl ibn Amr was a Qurayshi negotiator who represented Makkah at Hudaybiyyah. He later accepted Islam after the conquest of Makkah and became known for his public support of the Muslim community.","Ibn Hisham, al-Sirah al-Nabawiyyah; Ibn Sa'd, al-Tabaqat al-Kubra."],
["Amr ibn Abasah","Amr ibn Abasah was an early seeker of the truth who met the Prophet ﷺ in Makkah during the earliest period of the message. He transmitted hadith about purification and prayer and later joined the Muslim community.","Sahih Muslim, narration of Amr ibn Abasah; Ibn Sa'd."],
["Al-Aqra ibn Habis","Al-Aqra ibn Habis was a tribal leader from Tamim who met the Prophet ﷺ and accepted Islam. He appears in reports about delegations and the etiquette of speaking to the Prophet.","Sahih al-Bukhari and Sahih Muslim, reports concerning delegations; Ibn Sa'd."],
["Uyaynah ibn Hisn","Uyaynah ibn Hisn was a leader of the Fazarah tribe who came to the Prophet ﷺ with a delegation and later accepted Islam. Reports mention his interactions with the Prophet and the early Muslim community.","Sahih al-Bukhari, reports concerning Uyaynah; Ibn Sa'd, al-Tabaqat al-Kubra."],
["Ruwafi' ibn Thabit","Ruwafi' ibn Thabit was an Ansari Companion who transmitted reports from the Prophet ﷺ. His narrations include guidance on conduct and matters encountered during campaigns.","Sunan Abi Dawud and other hadith collections, narrations of Ruwafi'; Ibn Hajar, al-Isabah."],
["Bishr ibn al-Bara' ibn Ma'rur","Bishr ibn al-Bara' ibn Ma'rur was an Ansari Companion who ate with the Prophet ﷺ at Khaybar and later died after being affected by the poisoned food, according to historical reports.","Ibn Hisham, al-Sirah al-Nabawiyyah; Ibn Sa'd, al-Tabaqat al-Kubra; Prophetic Footsteps, Companion biographies."],
["Abu Jandal ibn Suhayl","Abu Jandal was the son of Suhayl ibn Amr. His arrival at Hudaybiyyah in chains became one of the most difficult moments of the treaty negotiations. He later joined the Muslim community and is remembered for patience and faith.","Sahih al-Bukhari, account of Hudaybiyyah; Ibn Hisham, al-Sirah."],
["Abu Basir Utbah ibn Usayd","Abu Basir was a Muslim from Makkah who reached Madinah after Hudaybiyyah. The treaty's terms led to his return, but he later gathered with other Muslims outside Madinah. His story forms part of the historical context of the treaty.","Sahih al-Bukhari, account of Hudaybiyyah; Ibn Hisham, al-Sirah."],
["Sahl ibn Sa'd","Sahl ibn Sa'd was an Ansari Companion who lived long after the Prophet ﷺ and transmitted reports about prayer and the Prophet's conduct.","Sahih al-Bukhari; Sahih Muslim; Ibn Sa'd."],
["Abu Musa al-Ash'ari","Abu Musa al-Ash'ari came from Yemen and became known for his Qur'an recitation. He served the community and transmitted hadith on worship and conduct.","Sahih al-Bukhari; Sahih Muslim; Ibn Sa'd."],
["Malik ibn al-Huwayrith","Malik ibn al-Huwayrith visited Madinah with young men to learn from the Prophet ﷺ. He transmitted the instruction to pray as they had seen the Prophet pray.","Sahih al-Bukhari; Ibn Sa'd."],
["Wa'il ibn Hujr","Wa'il ibn Hujr came from Hadramawt and transmitted descriptions of the Prophet's prayer, cited in discussions of prayer practice.","Sunan Abi Dawud; Jami at-Tirmidhi; Ibn Hajar."],
["Ukkasha ibn Mihsan","Ukkasha ibn Mihsan was an early Muslim who took part in Badr. A well-known hadith mentions him among those promised entry into Paradise without reckoning.","Sahih al-Bukhari; Sahih Muslim; Ibn Sa'd."],
["Abu Mahdhurah","Abu Mahdhurah became a mu'adhdhin in Makkah after the conquest. Reports preserve the Prophet's teaching to him of the call to prayer.","Sahih Muslim; Sunan Abi Dawud; Ibn Sa'd."],
["Nu'man ibn Muqarrin","Nu'man ibn Muqarrin was a Companion from Muzaynah. Historical accounts describe his command at Nihawand during Umar's caliphate, where he was killed.","Al-Tabari, Ta'rikh; Ibn Sa'd; Ibn Hajar."],
["Qays ibn Sa'd ibn Ubadah","Qays ibn Sa'd ibn Ubadah was an Ansari Companion known for generosity and leadership. He served the Prophet ﷺ and later held responsibilities in the Muslim community.","Ibn Sa'd, al-Tabaqat; al-Tabari, Ta'rikh."],
["Bashir ibn Sa'd","Bashir ibn Sa'd was an Ansari Companion and the father of Nu'man ibn Bashir. Early biographical works include him among the Companions of Madinah.","Ibn Sa'd, al-Tabaqat; Ibn Hajar, al-Isabah."],
["Mu'awwidh ibn Afra","Mu'awwidh ibn Afra was a young Ansari Companion associated with the Battle of Badr and is named in early accounts of the battle.","Ibn Hisham, al-Sirah; Ibn Sa'd; Ibn Hajar."],
["Mu'adh ibn Afra","Mu'adh ibn Afra was an Ansari Companion from the family of Afra and is mentioned in early records of the Battle of Badr.","Ibn Hisham, al-Sirah; Ibn Sa'd; Ibn Hajar."],
["Khallad ibn Rafi'","Khallad ibn Rafi' is named in the early biographical records of the Ansar and the Companions of Madinah.","Ibn Sa'd, al-Tabaqat; Ibn Hajar, al-Isabah."],
["Abu Rafi' (Ibrahim)","Abu Rafi' was associated with the Prophet's household and transmitted reports about the Prophet's life and practice.","Sahih al-Bukhari; Sahih Muslim; Ibn Sa'd."],
["Dhu al-Bijadayn (Abdullah ibn Abd Nahm)","Dhu al-Bijadayn was a Companion from Muzaynah who left his people to join the Prophet ﷺ. Sira accounts remember his devotion and death during Tabuk.","Ibn Hisham, al-Sirah; Ibn Sa'd; Ibn Hajar."],
["Abdullah ibn Suhayl","Abdullah ibn Suhayl accepted Islam before the conquest of Makkah and joined the Muslims. Early accounts report that he was killed at Yamamah.","Ibn Hisham, al-Sirah; Ibn Sa'd; al-Tabari."],
["Utbah ibn Ghazwan","Utbah ibn Ghazwan was among the early Muslims and emigrated to Abyssinia. During Umar's caliphate he helped establish Basra and served as its governor.","Ibn Sa'd, al-Tabaqat; al-Tabari; Ibn Hajar."],
["Qudamah ibn Maz'un","Qudamah ibn Maz'un was an early Muslim and brother of Uthman ibn Maz'un. He took part in the early migrations and later held responsibilities under Umar.","Ibn Sa'd, al-Tabaqat; al-Tabari; Ibn Hajar."],
["Khalid ibn Sa'id ibn al-As","Khalid ibn Sa'id ibn al-As was an early Qurayshi Muslim who emigrated to Abyssinia and later joined the Muslim campaigns.","Ibn Hisham, al-Sirah; Ibn Sa'd; Ibn Hajar."]

function validSurahData(data){
 return !!data&&typeof data.name==='string'&&Array.isArray(data.verses)&&data.verses.length>0&&data.verses.every(v=>Array.isArray(v)&&typeof v[0]==='string'&&v[0].trim().length>0&&typeof v[1]==='string'&&v[1].trim().length>0);
}
function parseQuranPayload(payload,n){
 if(!payload||payload.code!==200||!Array.isArray(payload.data)||payload.data.length<2)throw new Error('The Qur’an source returned incomplete data for Surah '+n+'.');
 const arabic=payload.data[0],english=payload.data[1];
 const count=Number(arabic.numberOfAyahs);
 if(!Number.isInteger(count)||count<1||Number(english.numberOfAyahs)!==count||!Array.isArray(arabic.ayahs)||!Array.isArray(english.ayahs)||arabic.ayahs.length!==count||english.ayahs.length!==count)throw new Error('Verse-count verification failed for Surah '+n+'. No incomplete copy was saved.');
 const verses=arabic.ayahs.map((a,i)=>{
  const ar=a&&a.text,en=english.ayahs[i]&&english.ayahs[i].text;
  if(typeof ar!=='string'||!ar.trim()||typeof en!=='string'||!en.trim())throw new Error('A verse is missing from Surah '+n+'. No incomplete copy was saved.');
  return [ar,en];
 });
 return {name:arabic.englishName||surahs[n-1],verses};
}
function quranDB(){
 if(quranDbPromise)return quranDbPromise;
 quranDbPromise=new Promise((resolve,reject)=>{
  if(!window.indexedDB){reject(new Error('Offline storage is not supported on this device'));return;}
  const req=indexedDB.open('AR_RISALA_QURAN',1);
  req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains('surahs'))db.createObjectStore('surahs',{keyPath:'number'});};
  req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);
 });
 return quranDbPromise;
}
async function getCachedSurah(n){
 try{const db=await quranDB();return await new Promise((resolve,reject)=>{const tx=db.transaction('surahs','readonly');const req=tx.objectStore('surahs').get(n);req.onsuccess=()=>resolve(req.result?.data||null);req.onerror=()=>reject(req.error);});}
 catch(e){return readOffline('surah_'+n);}
}
async function saveCachedSurah(n,data){
 try{const db=await quranDB();await new Promise((resolve,reject)=>{const tx=db.transaction('surahs','readwrite');tx.objectStore('surahs').put({number:n,data});tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});return true;}
 catch(e){return writeOffline('surah_'+n,data);}

async function fetchHadithRecord(book,number){
 const primary='https://sahih-al-bukhari.com/api/v1/hadith/'+book+'/'+number;
 try{
  const response=await fetch(primary);
  if(response.ok){
   const h=await response.json();
   const licenceName=String(h?.licence?.arabic_text?.name||'').trim();
   const isUnlicense=['unlicense','the unlicense (public-domain dedication)'].includes(licenceName.toLowerCase());
   if(h?.status==='ok'&&typeof h.arabic==='string'&&h.arabic.trim()&&h.reference&&String(h.canonical||'').startsWith('https://')&&isUnlicense)return h;
  }
 }catch(e){/* use the independently licensed repository mirror below */}
 const path='ara-'+book+'/'+number+'.json';
 const mirrors=[
  'https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1/editions/',
  'https://raw.githubusercontent.com/fawazahmed0/hadith-api/1/editions/'
 ];
 let payload=null;
 for(const base of mirrors){
  try{
   const response=await fetch(base+path);
   if(!response.ok)continue;
   payload=await response.json();
   break;
  }catch(e){/* try the second mirror */}
 }
 if(!payload||!Array.isArray(payload.hadiths))return null;
 const item=payload.hadiths.find(x=>String(x.hadithnumber)===String(number)&&typeof x.text==='string'&&x.text.trim());
 if(!item)return null;
 const detail=payload.metadata?.section_detail||{};
 let chapter='';
 for(const [section,range] of Object.entries(detail)){
  if(number>=Number(range.hadithnumber_first||0)&&number<=Number(range.hadithnumber_last||0)){
   chapter=payload.metadata?.section?.[section]||'';break;
  }
 }
 return {
  status:'ok',book,number:item.hadithnumber,
  reference:(HADITH_COLLECTIONS.find(x=>x.id===book)?.name||book)+' '+item.hadithnumber,
  arabic:item.text,grade:null,all_graders:[],chapter:{title:chapter},
  canonical:'https://github.com/fawazahmed0/hadith-api/blob/1/editions/'+path,
  source:{name:'fawazahmed0/hadith-api',edition:'ara-'+book},
  licence:{arabic_text:{name:'The Unlicense'}}
 };
}
async function buildHadithLibrary(){
 const btn=document.getElementById('build-hadith');if(btn)btn.disabled=true;
 const status=document.getElementById('build-status');if(status)status.textContent='Checking saved records and preparing resume…';
 try{
  await hadithDB();const p=hadithProgress();
  for(const book of HADITH_COLLECTIONS){
   if(!p[book.id])p[book.id]={count:0,next:1};
   // Reconcile progress against the actual IndexedDB records. This prevents a cleared
   // browser database from falsely reporting records that no longer exist.
   const existing=await dbGetHadith(book.id);
   const valid=existing.filter(r=>r&&r.book===book.id&&r.arabic&&r.reference&&r.licence==='Unlicense');
   p[book.id].count=valid.length;
   if(valid.length>=100){saveHadithProgress(p);await updateHadithProgress();continue;}
   const highest=valid.reduce((m,r)=>Math.max(m,Number(r.number)||0),0);
   p[book.id].next=Math.max(Number(p[book.id].next)||1,highest+1);
   saveHadithProgress(p);
   while(p[book.id].count<100){
    const number=p[book.id].next;
    if(number>12000)throw new Error('Safety stop: source did not provide enough permitted records for '+book.name+'. Saved progress is safe.');
    let h;
    try{h=await fetchHadithRecord(book.id,number);}
    catch(e){throw new Error('Hadith source is temporarily unavailable. Saved records are safe; resume when online.');}
    if(!h){p[book.id].next=number+1;saveHadithProgress(p);await updateHadithProgress();continue;}
    const licenceName=String(h?.licence?.arabic_text?.name||'').trim();
    const isUnlicense=/^(?:the\s+)?unlicense(?:\s*\(public-domain dedication\))?$/i.test(licenceName);
    const canonical=String(h?.canonical||'');
    const gradeLabel=String(h?.grade?.label||'').trim().toLowerCase();
    const acceptableGrade=true; // Source-audited Arabic text is included even when no grade is supplied; never invent a grade.
    const notUnderReview=String(h?.status||'').toLowerCase()!=='under_review';
    if(!notUnderReview){p[book.id].next=number+1;saveHadithProgress(p);await updateHadithProgress();await waitHadith(1050);continue;}
    if(!h?.arabic||typeof h.arabic!=='string'||!h.reference||!/^https:\/\//i.test(canonical)||!isUnlicense){
      p[book.id].next=number+1;saveHadithProgress(p);await waitHadith(1050);continue;
    }
    const record={id:book.id+':'+number,book:book.id,collection:book.name,number:h.number??number,reference:h.reference,arabic:h.arabic,grade:h.grade||null,all_graders:Array.isArray(h.all_graders)?h.all_graders:[],chapter:h.chapter?.title||'',status:h.status||'not supplied',canonical,sourceEdition:h.source?.edition||'fawazahmed0/hadith-api',licence:'Unlicense'};
    await dbPutHadith(record);
    p[book.id].count++;p[book.id].next=number+1;saveHadithProgress(p);await updateHadithProgress();
    if(status)status.textContent='Saved '+record.reference+' • '+(record.grade?.label||'Grade not supplied')+' • '+p[book.id].count+'/100 for '+book.name;
    await waitHadith(h?.source?.name==='fawazahmed0/hadith-api'?100:1050);
   }
  }
  const finalCounts=await Promise.all(HADITH_COLLECTIONS.map(async b=>(await dbGetHadith(b.id)).filter(r=>r&&r.arabic&&r.reference&&r.licence==='Unlicense').length));
  const total=finalCounts.reduce((a,n)=>a+n,0);
  if(status)status.textContent=total===600?'Complete: 600 source-audited Arabic Hadith records saved on this device. Any grade shown is exactly what the provider supplied; no missing grade has been invented. This is not independent scholarly authentication. English translations are not included.':'Paused: '+total+' / 600 graded records currently saved. Resume to continue.';
  await updateHadithProgress();await searchSavedHadith('');
 }catch(e){if(status)status.textContent=e.message||'Download paused. Saved progress is safe.';}
 finally{if(btn)btn.disabled=false;}
}
async function searchSavedHadith(query){

async function loadHadith(){
 const book=document.getElementById('hadith-book').value;
 const number=Number(document.getElementById('hadith-number').value);
 const box=document.getElementById('hadith-detail');
 if(!Number.isInteger(number)||number<1){box.innerHTML='<p>Please enter a valid Hadith number.</p>';return;}
 const offlineKey='hadith_'+book+'_'+number;
 const savedHadith=readOffline(offlineKey);
 if(savedHadith){box.innerHTML=savedHadith+'<p class="muted">Saved on this device • Offline copy</p>';return;}
 box.innerHTML='<p>Loading Hadith…</p>';
 try{
  const h=await fetchHadithRecord(book,number);
  if(!h||h.status!=='ok'||!h.arabic)throw new Error('This reference is not available in the source.');
  const grade=h.grade&&h.grade.label?h.grade.label:'Not supplied';
  const chapter=h.chapter&&h.chapter.title?h.chapter.title:'Chapter not supplied';
  box.innerHTML='<h3>'+escHadith(h.reference)+'</h3><p class="muted">'+escHadith(chapter)+'</p><div class="arabic">'+escHadith(h.arabic)+'</div><p><strong>Grade:</strong> '+escHadith(grade)+(h.grade&&h.grade.grader?' — '+escHadith(h.grade.grader):'')+'</p><p class="muted">Source edition: '+escHadith(h.source&&h.source.edition?h.source.edition:'not supplied')+'</p><p><a href="'+escHadith(h.canonical)+'" target="_blank" rel="noopener">Open source record</a></p>';
  try{localStorage.setItem('ar_risala_'+offlineKey,JSON.stringify(box.innerHTML));}catch(e){}
  const saveButton=document.createElement('button');saveButton.className='back';saveButton.textContent='☆ Save Hadith';saveButton.onclick=()=>bookmarkItem({id:'hadith_'+book+'_'+number,title:h.reference||('Hadith '+number),body:h.arabic,source:'Hadith collection: '+book+' • Grade: '+grade});box.appendChild(saveButton);
 }catch(e){box.innerHTML='<p>That number could not be loaded. Check the number or choose another collection.</p><button class="back" onclick="loadHadith()">Try again</button>';}
}
function filterList(q,id){document.querySelectorAll('#'+id+' .item').forEach(el=>el.style.display=el.textContent.toLowerCase().includes(q.toLowerCase())?'':'none')}
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>show(b.dataset.tab)));show('home');
</script>
