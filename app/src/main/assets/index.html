<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102b24">
<title>AR-RISALA</title>
<style>
:root{--bg:#f5f1e6;--green:#102b24;--gold:#c7a65a;--ink:#18251f;--muted:#66736b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,serif}
header{padding:30px 22px 24px;background:linear-gradient(145deg,#102b24,#1e4938);color:#fff;border-radius:0 0 28px 28px}
.brand{color:#e3c77e;letter-spacing:4px;font:700 12px Arial,sans-serif}
h1{font-size:32px;margin:12px 0 5px}.owner{font:13px Arial,sans-serif;color:#d8e2da}
header p{color:#e1e9e2;line-height:1.5;margin-bottom:0}
nav{display:flex;gap:8px;overflow:auto;padding:16px 14px}
nav button,.back{border:0;border-radius:22px;padding:11px 15px;background:#e5ddc9;color:var(--green);font-weight:bold;white-space:nowrap}
nav button.active{background:var(--green);color:white}
main{padding:4px 16px 28px;max-width:760px;margin:auto}
.panel{background:#fffdf8;border:1px solid #e7dfce;border-radius:18px;padding:18px;margin:10px 0;box-shadow:0 5px 18px #253a2510}
h2{color:var(--green);margin:4px 0 10px}h3{margin:0 0 6px;color:#284d3d}
p{line-height:1.55}.muted{color:var(--muted);font:13px Arial,sans-serif}
.item{padding:14px 0;border-bottom:1px solid #eee7d9}.item:last-child{border:0}
.item button{border:0;background:none;text-align:left;color:inherit;width:100%;font:inherit;padding:0}
.arabic{font-size:25px;line-height:1.9;text-align:right;color:#244c3b}
.search{width:100%;padding:13px;border:1px solid #d8d0bf;border-radius:12px;font-size:16px;margin:8px 0 12px}
footer{text-align:center;padding:20px;color:#6f786f;font:12px Arial,sans-serif}
</style>
</head>
<body>
<header><div class="brand">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div><h1>AR-RISALA</h1><div class="owner">Knowledge • Faith • Guidance</div><p>A place to learn the Qur’an, authentic Hadith and the lives of the Companions.</p></header>
<nav id="nav"><button class="active" data-tab="home">Home</button><button data-tab="quran">Qur’an</button><button data-tab="hadith">Hadith</button><button data-tab="sahaba">Sahaba</button><button data-tab="saved">Saved</button><button data-tab="about">About</button></nav>
<main id="content"></main><footer>AR-RISALA • Built with care for seekers of knowledge</footer>
<script>
const surahs=["Al-Fatihah","Al-Baqarah","Aal-Imran","An-Nisa","Al-Ma'idah","Al-An'am","Al-A'raf","Al-Anfal","At-Tawbah","Yunus","Hud","Yusuf","Ar-Ra'd","Ibrahim","Al-Hijr","An-Nahl","Al-Isra","Al-Kahf","Maryam","Ta-Ha","Al-Anbiya","Al-Hajj","Al-Mu'minun","An-Nur","Al-Furqan","Ash-Shu'ara","An-Naml","Al-Qasas","Al-Ankabut","Ar-Rum","Luqman","As-Sajdah","Al-Ahzab","Saba","Fatir","Ya-Sin","As-Saffat","Sad","Az-Zumar","Ghafir","Fussilat","Ash-Shura","Az-Zukhruf","Ad-Dukhan","Al-Jathiyah","Al-Ahqaf","Muhammad","Al-Fath","Al-Hujurat","Qaf","Adh-Dhariyat","At-Tur","An-Najm","Al-Qamar","Ar-Rahman","Al-Waqi'ah","Al-Hadid","Al-Mujadilah","Al-Hashr","Al-Mumtahanah","As-Saff","Al-Jumu'ah","Al-Munafiqun","At-Taghabun","At-Talaq","At-Tahrim","Al-Mulk","Al-Qalam","Al-Haqqah","Al-Ma'arij","Nuh","Al-Jinn","Al-Muzzammil","Al-Muddaththir","Al-Qiyamah","Al-Insan","Al-Mursalat","An-Naba","An-Nazi'at","Abasa","At-Takwir","Al-Infitar","Al-Mutaffifin","Al-Inshiqaq","Al-Buruj","At-Tariq","Al-A'la","Al-Ghashiyah","Al-Fajr","Al-Balad","Ash-Shams","Al-Layl","Ad-Duha","Ash-Sharh","At-Tin","Al-Alaq","Al-Qadr","Al-Bayyinah","Az-Zalzalah","Al-Adiyat","Al-Qari'ah","At-Takathur","Al-Asr","Al-Humazah","Al-Fil","Quraysh","Al-Ma'un","Al-Kawthar","Al-Kafirun","An-Nasr","Al-Masad","Al-Ikhlas","Al-Falaq","An-Nas"];
const sahaba=[
["Abu Bakr as-Siddiq","Abdullah ibn Abi Quhafah was among the earliest Muslims and the close companion of the Prophet ﷺ. He accompanied the Prophet during the Hijrah to Madinah. After the Prophet’s death in 632 CE, he became the first caliph. His leadership included preserving the Muslim community during the Ridda conflicts and initiating the collection of Qur’anic material into one compilation after the Battle of Yamamah.","Ibn Hisham, al-Sirah al-Nabawiyyah; Sahih al-Bukhari, reports on the compilation of the Qur’an."],
["Umar ibn al-Khattab","Umar ibn al-Khattab was an early and prominent Companion who became the second caliph after Abu Bakr. His caliphate (634–644 CE) saw major administrative organisation and the expansion of the Muslim polity. Muslim historical tradition remembers him for public accountability, firmness and concern for justice.","Ibn Sa'd, al-Tabaqat al-Kubra; al-Tabari, Ta'rikh al-Rusul wa-l-Muluk."],
["Uthman ibn Affan","Uthman ibn Affan was an early Muslim, known for generosity and modesty. He became the third caliph in 644 CE. During his caliphate, a standard written recension of the Qur’an was commissioned and sent to major centres to help preserve a common recitation text. He was killed in 656 CE during a period of severe internal conflict.","Sahih al-Bukhari, reports on the standardisation of the Qur’an; Ibn Sa'd, al-Tabaqat al-Kubra."],
["Ali ibn Abi Talib","Ali ibn Abi Talib was the Prophet’s cousin and son-in-law, husband of Fatimah. He was among the earliest Muslims and was known in Islamic tradition for knowledge, courage and closeness to the Prophet ﷺ. He became the fourth caliph in 656 CE and was killed in 661 CE.","Ibn Hisham, al-Sirah al-Nabawiyyah; Ibn Sa'd, al-Tabaqat al-Kubra."],
["Khadijah bint Khuwaylid","Khadijah was a respected merchant of Makkah and the first wife of the Prophet Muhammad ﷺ. She was the first person to believe in his message and supported him through the earliest and most difficult years of revelation. She is honoured as one of the greatest women in Islamic tradition.","Ibn Hisham, al-Sirah al-Nabawiyyah; Sahih al-Bukhari, virtues of Khadijah."],
["Bilal ibn Rabah","Bilal was an early Muslim who endured persecution for his faith in Makkah and was freed by Abu Bakr. He became known as the Prophet’s muezzin, calling the believers to prayer. His life is remembered as a powerful example of steadfastness and dignity.","Ibn Sa'd, al-Tabaqat al-Kubra; Ibn Hajar, al-Isabah fi Tamyiz al-Sahabah."],
["Abd al-Rahman ibn Awf","Abd al-Rahman ibn Awf was among the early Muslims and emigrated to Madinah, where he became known as a successful trader and generous giver. He is included in the well-known group of ten Companions given glad tidings of Paradise in hadith reports.","Jami at-Tirmidhi, virtues of the ten; Ibn Sa'd, al-Tabaqat al-Kubra."],
["Talhah ibn Ubayd Allah","Talhah ibn Ubayd Allah was an early Muslim and a Companion remembered for his courage at the Battle of Uhud, where reports describe him protecting the Prophet ﷺ and suffering serious injuries. He is also named among the ten Companions given glad tidings of Paradise.","Jami at-Tirmidhi, virtues of the ten; Ibn Hajar, al-Isabah fi Tamyiz al-Sahabah."],
["Zubayr ibn al-Awwam","Al-Zubayr ibn al-Awwam was a cousin of the Prophet ﷺ through his aunt Safiyyah and one of the early Muslims. He took part in major events of the early Muslim community and is named among the ten Companions given glad tidings of Paradise.","Sahih al-Bukhari, virtues of the Companions; Ibn Sa'd, al-Tabaqat al-Kubra."],
["Sa'd ibn Abi Waqqas","Sa'd ibn Abi Waqqas was among the earliest Muslims and a skilled archer. He is named among the ten Companions given glad tidings of Paradise. In the caliphate of Umar, he commanded Muslim forces in the campaign associated with al-Qadisiyyah and later helped establish Kufa.","Jami at-Tirmidhi, virtues of the ten; al-Tabari, Ta'rikh al-Rusul wa-l-Muluk."]

,["Salman al-Farisi","Salman al-Farisi is remembered for his long search for truth before accepting Islam. He became a close Companion and is associated in the historical accounts of the Battle of the Trench with proposing the defensive trench strategy. His life is often recalled as an example of sincere searching, patience and faith.","Ibn Hisham, al-Sirah al-Nabawiyyah; Ibn Sa'd, al-Tabaqat al-Kubra."]
,["Abu Ubaydah ibn al-Jarrah","Abu Ubaydah ibn al-Jarrah was an early Muslim and a trusted Companion. He is remembered in hadith reports for the title Amin al-Ummah (the trustworthy one of this community). He served as a commander during the early Muslim campaigns in Syria.","Sahih al-Bukhari, reports on Abu Ubaydah; Ibn Sa'd, al-Tabaqat al-Kubra."]
,["Mu'adh ibn Jabal","Mu'adh ibn Jabal was a learned Companion from the Ansar. Islamic reports describe the Prophet ﷺ sending him to Yemen to teach and guide its people. He is especially remembered for knowledge of the Qur’an and religious understanding.","Sunan Abi Dawud, reports concerning Mu'adh; Ibn Sa'd, al-Tabaqat al-Kubra."]
,["Ubayy ibn Ka'b","Ubayy ibn Ka'b was one of the Ansar and a notable reciter and teacher of the Qur’an. Hadith reports mention the Prophet ﷺ identifying him among those from whom the Qur’an should be learned. His name is closely associated with Qur’anic recitation and teaching.","Sahih al-Bukhari, virtues and recitation reports; Ibn Sa'd, al-Tabaqat al-Kubra."]
,["Abdullah ibn Mas'ud","Abdullah ibn Mas'ud was among the earliest Muslims and became renowned for his knowledge of the Qur’an. Reports describe his close attendance upon the Prophet ﷺ and his role in teaching Qur’an and religious knowledge to later generations.","Sahih al-Bukhari, virtues of the Qur’an and Companions; Ibn Sa'd, al-Tabaqat al-Kubra."]
,["Abu Hurayrah","Abu Hurayrah embraced Islam in the later Madinan period and became one of the most prolific transmitters of Prophetic hadith. He devoted himself to learning and preserving reports, and many narrations in the major hadith collections are transmitted through him.","Sahih al-Bukhari and Sahih Muslim, reports transmitted by Abu Hurayrah; Ibn Hajar, al-Isabah."]
,["Anas ibn Malik","Anas ibn Malik served the Prophet ﷺ in Madinah for years from a young age. He later lived to teach hadith and recount his experiences to generations of Muslims. His narrations preserve details of the Prophet’s conduct and daily life.","Sahih al-Bukhari and Sahih Muslim, narrations of Anas; Ibn Sa'd, al-Tabaqat al-Kubra."]
,["Ja'far ibn Abi Talib","Ja'far ibn Abi Talib was the Prophet’s cousin and the elder brother of Ali. He led a group of Muslims who migrated to Abyssinia and spoke before its ruler on behalf of the Muslim refugees. He was killed at the Battle of Mu'tah and is remembered as Ja'far al-Tayyar in Islamic tradition.","Ibn Hisham, al-Sirah al-Nabawiyyah; Sahih al-Bukhari, reports concerning the Battle of Mu'tah."]
,["Mus'ab ibn Umayr","Mus'ab ibn Umayr was a young Companion from Makkah who accepted Islam despite hardship. The Prophet ﷺ sent him to Yathrib before the Hijrah to teach the new Muslims; his work helped prepare the community that welcomed the emigrants. He was martyred at Uhud.","Ibn Hisham, al-Sirah al-Nabawiyyah; Ibn Sa'd, al-Tabaqat al-Kubra."]
,["Ammar ibn Yasir","Ammar ibn Yasir and his family were among the earliest Muslims to suffer persecution in Makkah. He endured severe hardship for his faith and later took part in the life of the Muslim community in Madinah. His steadfastness is remembered in early Islamic history.","Ibn Hisham, al-Sirah al-Nabawiyyah; Sahih al-Bukhari, reports concerning Ammar."]
];
const hadith=[["Actions are judged by intentions","“Actions are but by intentions, and every person will have only what they intended.”","Sahih al-Bukhari 1; Sahih Muslim 1907","Authenticity: Sahih"],["The best among you","“The best of you are those who learn the Qur’an and teach it.”","Sahih al-Bukhari 5027","Authenticity: Sahih"],["Speak good or remain silent","“Whoever believes in Allah and the Last Day should speak good or remain silent.”","Sahih al-Bukhari 6018; Sahih Muslim 47","Authenticity: Sahih"],["Mercy","“Those who show mercy will be shown mercy by the Most Merciful.”","Jami at-Tirmidhi 1924","Authenticity: Hasan Sahih"]];
function show(tab){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));const c=document.getElementById('content');
if(tab==='home')c.innerHTML='<section class="panel"><h2>Assalamu Alaikum</h2><p>Welcome to AR-RISALA. Explore the Qur’an, study Hadith and learn about the noble Companions.</p><p class="muted">Choose a section above to begin.</p></section><section class="panel"><h3>Our purpose</h3><p>Authentic knowledge, clear references and respectful learning.</p></section>';
if(tab==='quran')c.innerHTML='<section class="panel"><h2>The Holy Qur’an</h2><p class="muted">All 114 Surahs. Select any Surah to load its complete Arabic text and Sahih International English translation. Internet connection is required.</p><input class="search" placeholder="Search Surah..." oninput="filterList(this.value,\\'surah-list\\')"><div id="surah-list">'+surahs.map((s,i)=>'<div class="item"><button onclick="openSurah('+(i+1)+')"><strong>'+(i+1)+'. '+s+'</strong><div class="muted">Open Surah '+(i+1)+' →</div></button></div>').join('')+'</div><div id="surah-detail"></div></section>';
if(tab==='hadith')c.innerHTML='<section class="panel"><h2>Hadith Library</h2><p class="muted">Browse the six major Hadith collections. Choose a book and reference number to load the Arabic narration, chapter, source and available grading. English translations are not supplied by this source.</p><label for="hadith-book">Collection</label><select id="hadith-book" class="search"><option value="bukhari">Sahih al-Bukhari</option><option value="muslim">Sahih Muslim</option><option value="abudawud">Sunan Abi Dawud</option><option value="tirmidhi">Jami at-Tirmidhi</option><option value="nasai">Sunan an-Nasa’i</option><option value="ibnmajah">Sunan Ibn Majah</option></select><label for="hadith-number">Hadith number</label><input id="hadith-number" class="search" type="number" min="1" value="1" placeholder="Enter hadith number"><button class="back" onclick="loadHadith()">Read Hadith</button><div id="hadith-detail" class="item"><p class="muted">Select a collection and number, then tap Read Hadith.</p></div><p class="muted">Data and grading attribution: Sahih al-Bukhari API. Always check the linked source and consult qualified scholars for interpretation.</p></section>'
if(tab==='sahaba')c.innerHTML='<section class="panel"><h2>Lives of the Sahaba</h2><p class="muted">Starter biographies in this app, with further reading from published biographical collections. We are expanding the in-app set toward 150 entries with source notes.</p><input class="search" placeholder="Search Companion..." oninput="filterList(this.value,\'sahaba-list\')"><div id="sahaba-list">'+sahaba.map(s=>'<div class="item"><h3>'+s[0]+'</h3><p>'+s[1]+'</p><p class="muted"><strong>Further sources:</strong> '+s[2]+'</p></div>').join('')+'</div><div class="item"><h3>Further reading and source works</h3><p><a href="https://sahibukum.com/companions/" target="_blank" rel="noopener">Read a referenced collection of 140 Companion biographies</a></p><p><a href="https://revivesahaba.com/sources/" target="_blank" rel="noopener">See classical source books and bibliography</a></p><p class="muted">The external biographies are independent resources, not written or owned by AR-RISALA.</p></div></section>';
if(tab==='saved')c.innerHTML='<section class="panel"><h2>My Bookmarks</h2><p class="muted">Saved verses and Hadith stay on this device.</p><div id="saved-list"></div></section>';renderBookmarks();
if(tab==='about')c.innerHTML='<section class="panel"><h2>About AR-RISALA</h2><p>Knowledge • Faith • Guidance</p><p>Created by <strong>Abdirahman Jarso (Abjata)</strong>.</p><p>May Allah make this project beneficial and accept it as a source of ongoing good.</p></section>';
}
const quranText={1:{name:"Al-Fatihah",verses:[["بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ","In the name of Allah, the Most Compassionate, the Most Merciful."],["الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ","All praise is for Allah—Lord of all worlds."],["الرَّحْمَٰنِ الرَّحِيمِ","The Most Compassionate, the Most Merciful."],["مَالِكِ يَوْمِ الدِّينِ","Master of the Day of Judgment."],["إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ","You alone we worship and You alone we ask for help."],["اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ","Guide us along the Straight Path."],["صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ","The Path of those You have blessed—not those You are displeased with, or those who are astray."]]},112:{name:"Al-Ikhlas",verses:[["قُلْ هُوَ اللَّهُ أَحَدٌ","Say, ˹O Prophet,˺ “He is Allah—One ˹and Indivisible˺.”"],["اللَّهُ الصَّمَدُ","Allah—the Sustainer ˹needed by all˺."],["لَمْ يَلِدْ وَلَمْ يُولَدْ","He has never had offspring, nor was He born."],["وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ","And there is none comparable to Him."]]}};
const surahCache={};
function readOffline(key){try{return JSON.parse(localStorage.getItem('ar_risala_'+key)||'null')}catch(e){return null}}
function writeOffline(key,value){try{localStorage.setItem('ar_risala_'+key,JSON.stringify(value));return true}catch(e){return false}}
async function openSurah(n){
 const d=document.getElementById('surah-detail');
 d.innerHTML='<div class="item"><h3>Surah '+n+': '+surahs[n-1]+'</h3><p>Loading verified Qur’an text and English translation…</p></div>';
 d.scrollIntoView({behavior:"smooth",block:"start"});
 if(surahCache[n]){renderSurah(n,surahCache[n]);return;}
 const savedSurah=readOffline('surah_'+n);
 if(savedSurah){surahCache[n]=savedSurah;renderSurah(n,savedSurah);return;}
 try{
  const response=await fetch('https://api.alquran.cloud/v1/surah/'+n+'/editions/quran-uthmani,en.sahih');
  if(!response.ok)throw new Error('Network response was not successful');
  const payload=await response.json();
  if(payload.code!==200||!payload.data||payload.data.length<2)throw new Error('Qur’an data unavailable');
  const arabic=payload.data[0].ayahs,english=payload.data[1].ayahs;
  const verses=arabic.map((a,i)=>[a.text,english[i]?english[i].text:'']);
  surahCache[n]={name:payload.data[0].englishName||surahs[n-1],verses};
  writeOffline('surah_'+n,surahCache[n]);
  renderSurah(n,surahCache[n]);
 }catch(error){
  const local=quranText[n];
  if(local){renderSurah(n,local);d.insertAdjacentHTML('afterbegin','<p class="muted">Offline sample shown. Connect to the internet to load the complete Surah.</p>');}
  else d.innerHTML='<div class="item"><h3>'+surahs[n-1]+'</h3><p>Could not load the full verified text. Please check your internet connection and try again.</p><button class="back" onclick="openSurah('+n+')">Try again</button></div>';
 }
}
function getBookmarks(){try{return JSON.parse(localStorage.getItem('ar_risala_bookmarks')||'[]')}catch(e){return []}}
function bookmarkItem(item){const items=getBookmarks();if(!items.some(x=>x.id===item.id)){items.unshift(item);try{localStorage.setItem('ar_risala_bookmarks',JSON.stringify(items))}catch(e){alert('Storage is full')}}alert('Saved to My Bookmarks')}
function removeBookmark(id){try{localStorage.setItem('ar_risala_bookmarks',JSON.stringify(getBookmarks().filter(x=>x.id!==id)))}catch(e){}renderBookmarks()}
function renderBookmarks(){const target=document.getElementById('saved-list');if(!target)return;const items=getBookmarks();target.innerHTML=items.length?items.map(x=>'<div class="item"><h3>'+x.title+'</h3><p>'+x.body+'</p><p class="muted">'+x.source+'</p><button class="back" onclick="removeBookmark(\\''+x.id+'\\')">Remove</button></div>').join(''):'<p class="muted">No bookmarks yet. Save a verse or Hadith while reading.</p>'}
function renderSurah(n,data){
 const d=document.getElementById('surah-detail');
 d.innerHTML='<div class="item"><h3>Surah '+n+': '+data.name+'</h3><p class="muted">Arabic text: Uthmani script • English translation: Sahih International • Source: AlQuran Cloud</p>'+data.verses.map((v,i)=>'<div class="item"><div class="arabic">'+v[0]+' <span class="muted">۞ '+(i+1)+'</span></div><p>'+v[1]+'</p><button class="back" onclick="bookmarkItem({id:\\'quran_'+n+'_'+(i+1)+'\\',title:\\'Surah '+n+' • Ayah '+(i+1)+'\\',body:\\''+v[0]+' — '+v[1]+'\\',source:\\'Qur’an • '+data.name+'\\'})">☆ Save verse</button></div>').join('')+'</div>';
 d.scrollIntoView({behavior:"smooth",block:"start"});
}
async function loadHadith(){
 const book=document.getElementById('hadith-book').value;
 const number=Number(document.getElementById('hadith-number').value);
 const box=document.getElementById('hadith-detail');
 if(!Number.isInteger(number)||number<1){box.innerHTML='<p>Please enter a valid Hadith number.</p>';return;}
 const offlineKey='hadith_'+book+'_'+number;
 const savedHadith=readOffline(offlineKey);
 if(savedHadith){box.innerHTML=savedHadith+'<p class="muted">Saved on this device • Offline copy</p>';return;}
 box.innerHTML='<p>Loading Hadith…</p>';
 try{
  const res=await fetch('https://sahih-al-bukhari.com/api/v1/hadith/'+book+'/'+number);
  if(!res.ok)throw new Error('Reference not available');
  const h=await res.json();
  if(h.status!=='ok'||!h.arabic)throw new Error('This reference is not available in the source.');
  const grade=h.grade&&h.grade.label?h.grade.label:'Not supplied';
  const chapter=h.chapter&&h.chapter.title?h.chapter.title:'Chapter not supplied';
  box.innerHTML='<h3>'+h.reference+'</h3><p class="muted">'+chapter+'</p><div class="arabic">'+h.arabic+'</div><p><strong>Grade:</strong> '+grade+(h.grade&&h.grade.grader?' — '+h.grade.grader:'')+'</p><p class="muted">Source edition: '+(h.source&&h.source.edition?h.source.edition:'not supplied')+'</p><p><a href="'+h.canonical+'" target="_blank" rel="noopener">Open source record</a></p>';
  try{localStorage.setItem('ar_risala_'+offlineKey,JSON.stringify(box.innerHTML));}catch(e){}
  const saveButton=document.createElement('button');saveButton.className='back';saveButton.textContent='☆ Save Hadith';saveButton.onclick=()=>bookmarkItem({id:'hadith_'+book+'_'+number,title:h.reference||('Hadith '+number),body:h.arabic,source:'Hadith collection: '+book+' • Grade: '+grade});box.appendChild(saveButton);
 }catch(e){box.innerHTML='<p>That number could not be loaded. Check the number or choose another collection.</p><button class="back" onclick="loadHadith()">Try again</button>';}
}
function filterList(q,id){document.querySelectorAll('#'+id+' .item').forEach(el=>el.style.display=el.textContent.toLowerCase().includes(q.toLowerCase())?'':'none')}
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>show(b.dataset.tab)));show('home');
</script>
</body></html>
